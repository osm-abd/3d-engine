<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Motor — 3D V8 Engine</title>
  <meta name="description" content="An interactive, line-art 3D model of a V8 engine. Rotate it, focus on any part, explode it into its components and watch it turn over." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D model of a V8 engine"></canvas>
  <div id="readout" aria-hidden="true"></div>

  <header class="masthead">
    <p class="eyebrow">Plate II · Motor</p>
    <h1>The V8 Engine</h1>
    <p class="subtitle">An interactive study of its parts</p>
  </header>

  <button id="index-toggle" class="chip-btn index-toggle" aria-expanded="false" aria-controls="index">Parts</button>

  <nav id="index" class="panel index" aria-label="Engine parts">
    <div class="index-head">
      <input id="search" type="search" placeholder="Search parts…" autocomplete="off" spellcheck="false" />
    </div>
    <div id="index-list" class="index-list"></div>
  </nav>

  <aside id="info" class="panel info" aria-live="polite"></aside>

  <div class="toolbar" role="toolbar" aria-label="View controls">
    <button id="explode-btn" class="tool primary" aria-pressed="false" title="Pull every part away from the block (E)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.2 3.2M15.2 15.2l3.2 3.2M5.6 18.4l3.2-3.2M15.2 8.8l3.2-3.2"/><circle cx="12" cy="12" r="2.2"/></svg>
      <span>Explode</span>
    </button>
    <label class="slider" title="Explosion amount">
      <span class="sr-only">Explosion amount</span>
      <input id="explode-range" type="range" min="0" max="1" step="0.01" value="0" />
    </label>
    <span class="divider"></span>
    <button id="run-btn" class="tool run" aria-pressed="false" title="Turn the engine over slowly (Space)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 12l4.2-4.2"/></svg>
      <span>Run</span>
    </button>
    <span class="divider"></span>
    <div class="views" role="group" aria-label="Standard views">
      <button class="tool" data-view="left" title="Left side view">L</button>
      <button class="tool" data-view="right" title="Right side view">R</button>
      <button class="tool" data-view="front" title="Front view">F</button>
      <button class="tool" data-view="back" title="Rear view">B</button>
      <button class="tool" data-view="top" title="Top view">T</button>
      <button class="tool" data-view="bottom" title="Underside view">U</button>
    </div>
    <span class="divider"></span>
    <button id="cut-btn" class="tool" aria-pressed="false" title="Section across cylinders 1 and 2 (C)">Cut</button>
    <button id="reset-btn" class="tool" title="Reset view (R)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
    </button>
  </div>

  <svg id="compass" viewBox="-50 -50 100 100" aria-hidden="true"></svg>

  <div id="loader" class="loader">
    <div class="loader-inner">
      <svg viewBox="0 0 120 80" class="loader-mark" aria-hidden="true">
        <path d="M60 70L22 20M60 70l38-50M30 30l-10-13 8-6 10 13M90 30l10-13-8-6-10 13M60 70v-8M44 60a16 16 0 0 0 32 0"/>
      </svg>
      <p id="loader-text">Assembling the engine…</p>
    </div>
  </div>

  <noscript><p class="noscript">This viewer needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
